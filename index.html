<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Movie Ticket Booking System</h1>
            <p>Choose your favourite movie and book your tickets.</p>
        </header>

        <section class="panel">
            <h2>Available Movies</h2>

            <div class="movies">
                <div class="movie">
                    <h3>Avengers Endgame Encore</h3>
                    <p>Action</p>
                    <b>Rs. 280</b>
                </div>

                <div class="movie">
                    <h3>Avatar (IMAX)</h3>
                    <p>Science Fiction</p>
                    <b>Rs. 300</b>
                </div>

                <div class="movie">
                    <h3>Godzilla x Kong: The New Empire</h3>
                    <p>Adventure</p>
                    <b>Rs. 250</b>
                </div>
            </div>
        </section>

        <div class="booking-area">
            <section class="panel" id="booked"></section>
            <section class="panel" id="bookings"></section>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
